<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head(${id == null} ? 'Novo cliente' : 'Editar cliente')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('clientes')}"></nav>
<main class="container" style="max-width: 640px">
    <h1 class="h3 mb-3" th:text="${id == null} ? 'Novo cliente' : 'Editar cliente #' + ${id}">Cliente</h1>

    <!-- Criação: POST /app/clientes | Edição: PUT /app/clientes/{id} (campo oculto _method=put) -->
    <form class="card p-4" th:object="${form}" novalidate
          th:action="${id == null} ? @{/app/clientes} : @{/app/clientes/{id}(id=${id})}"
          th:method="${id == null} ? 'post' : 'put'">
        <div th:replace="~{fragments/layout :: errosGlobais}"></div>

        <div class="mb-3">
            <label for="nome" class="form-label">Nome *</label>
            <input type="text" class="form-control" th:field="*{nome}" th:errorclass="is-invalid" maxlength="100">
            <div class="invalid-feedback" th:errors="*{nome}"></div>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">E-mail *</label>
            <input type="email" class="form-control" th:field="*{email}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{email}"></div>
        </div>
        <div class="mb-3">
            <label for="telefone" class="form-label">Telefone</label>
            <input type="text" class="form-control" th:field="*{telefone}" th:errorclass="is-invalid" maxlength="20">
            <div class="invalid-feedback" th:errors="*{telefone}"></div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a class="btn btn-outline-secondary" th:href="@{/app/clientes}">Cancelar</a>
        </div>
    </form>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
