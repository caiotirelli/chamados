<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Clientes')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('clientes')}"></nav>
<main class="container">
    <div th:replace="~{fragments/layout :: mensagens}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Clientes</h1>
        <a class="btn btn-primary" th:href="@{/app/clientes/novo}">+ Novo cliente</a>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr><th>#</th><th>Nome</th><th>E-mail</th><th>Telefone</th><th class="text-end">Ações</th></tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(clientes)}">
                    <td colspan="5" class="text-center text-muted py-4">Nenhum cliente cadastrado.</td>
                </tr>
                <tr th:each="c : ${clientes}">
                    <td th:text="${c.id}">1</td>
                    <td th:text="${c.nome}">Nome</td>
                    <td th:text="${c.email}">email</td>
                    <td th:text="${c.telefone} ?: '-'">telefone</td>
                    <td class="text-end acoes">
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/app/chamados(clienteId=${c.id})}">Chamados</a>
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/app/clientes/{id}/editar(id=${c.id})}">Editar</a>
                        <!-- th:method="delete" gera um campo oculto _method=delete (HiddenHttpMethodFilter) -->
                        <form th:action="@{/app/clientes/{id}(id=${c.id})}" th:method="delete"
                              onsubmit="return confirm('Excluir este cliente?')">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Excluir</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
