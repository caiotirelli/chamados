<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Chamados')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('chamados')}"></nav>
<main class="container">
    <div th:replace="~{fragments/layout :: mensagens}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Chamados</h1>
        <a class="btn btn-primary" th:href="@{/app/chamados/novo}">+ Abrir chamado</a>
    </div>

    <!-- Filtros: GET /app/chamados?status=...&prioridade=...&clienteId=... -->
    <form class="card p-3 mb-3" th:action="@{/app/chamados}" method="get">
        <div class="row g-2 align-items-end">
            <div class="col-12 col-md-3">
                <label class="form-label small mb-1" for="fStatus">Status</label>
                <select class="form-select" id="fStatus" name="status">
                    <option value="">Todos</option>
                    <option th:each="s : ${todosStatus}" th:value="${s}" th:selected="${s == status}"
                            th:text="${#strings.replace(s, '_', ' ')}">ABERTO</option>
                </select>
            </div>
            <div class="col-12 col-md-3">
                <label class="form-label small mb-1" for="fPrioridade">Prioridade</label>
                <select class="form-select" id="fPrioridade" name="prioridade">
                    <option value="">Todas</option>
                    <option th:each="p : ${prioridades}" th:value="${p}" th:selected="${p == prioridade}"
                            th:text="${p}">ALTA</option>
                </select>
            </div>
            <div class="col-12 col-md-3">
                <label class="form-label small mb-1" for="fCliente">Cliente</label>
                <select class="form-select" id="fCliente" name="clienteId">
                    <option value="">Todos</option>
                    <option th:each="c : ${clientes}" th:value="${c.id}" th:selected="${c.id == clienteId}"
                            th:text="${c.nome}">Cliente</option>
                </select>
            </div>
            <div class="col-12 col-md-3 d-flex gap-2">
                <button type="submit" class="btn btn-outline-primary flex-fill">Filtrar</button>
                <a class="btn btn-outline-secondary flex-fill" th:href="@{/app/chamados}">Limpar</a>
            </div>
        </div>
    </form>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>#</th><th>Título</th><th>Cliente</th><th>Categoria</th><th>Técnico</th>
                    <th>Prioridade</th><th>Status</th><th>Abertura</th><th class="text-end">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${pagina.empty}">
                    <td colspan="9" class="text-center text-muted py-4">Nenhum chamado encontrado.</td>
                </tr>
                <tr th:each="c : ${pagina.content}">
                    <td th:text="${c.id}">1</td>
                    <td><a th:href="@{/app/chamados/{id}(id=${c.id})}" th:text="${c.titulo}">Título</a></td>
                    <td th:text="${c.clienteNome}">Cliente</td>
                    <td th:text="${c.categoriaNome}">Categoria</td>
                    <td th:text="${c.tecnicoNome} ?: '-'">Técnico</td>
                    <td><span class="badge" th:classappend="'prio-' + ${c.prioridade}" th:text="${c.prioridade}">ALTA</span></td>
                    <td><span class="badge" th:classappend="'status-' + ${c.status}"
                              th:text="${#strings.replace(c.status, '_', ' ')}">ABERTO</span></td>
                    <td th:text="${#temporals.format(c.dataAbertura, 'dd/MM/yyyy HH:mm')}">01/01/2026</td>
                    <td class="text-end acoes">
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/app/chamados/{id}(id=${c.id})}">Abrir</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Paginação (Pageable do Spring Data): ?page=0,1,2... mantendo os filtros -->
    <nav class="mt-3" th:if="${pagina.totalPages > 1}" aria-label="Paginação">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${pagina.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/app/chamados(page=${pagina.number - 1}, status=${status}, prioridade=${prioridade}, clienteId=${clienteId})}">Anterior</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, pagina.totalPages - 1)}"
                th:classappend="${i == pagina.number} ? 'active'">
                <a class="page-link" th:text="${i + 1}"
                   th:href="@{/app/chamados(page=${i}, status=${status}, prioridade=${prioridade}, clienteId=${clienteId})}">1</a>
            </li>
            <li class="page-item" th:classappend="${pagina.last} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/app/chamados(page=${pagina.number + 1}, status=${status}, prioridade=${prioridade}, clienteId=${clienteId})}">Próxima</a>
            </li>
        </ul>
    </nav>
    <p class="text-muted small text-center" th:text="${pagina.totalElements} + ' chamado(s) no total'">0 chamados</p>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
