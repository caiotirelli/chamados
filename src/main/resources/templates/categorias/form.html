<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head(${id == null} ? 'Nova categoria' : 'Editar categoria')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('categorias')}"></nav>
<main class="container" style="max-width: 640px">
    <h1 class="h3 mb-3" th:text="${id == null} ? 'Nova categoria' : 'Editar categoria #' + ${id}">Categoria</h1>

    <form class="card p-4" th:object="${form}" novalidate
          th:action="${id == null} ? @{/app/categorias} : @{/app/categorias/{id}(id=${id})}"
          th:method="${id == null} ? 'post' : 'put'">
        <div th:replace="~{fragments/layout :: errosGlobais}"></div>

        <div class="mb-3">
            <label for="nome" class="form-label">Nome *</label>
            <input type="text" class="form-control" th:field="*{nome}" th:errorclass="is-invalid" maxlength="60">
            <div class="invalid-feedback" th:errors="*{nome}"></div>
        </div>
        <div class="mb-3">
            <label for="descricao" class="form-label">Descrição</label>
            <textarea class="form-control" rows="3" th:field="*{descricao}" th:errorclass="is-invalid" maxlength="255"></textarea>
            <div class="invalid-feedback" th:errors="*{descricao}"></div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a class="btn btn-outline-secondary" th:href="@{/app/categorias}">Cancelar</a>
        </div>
    </form>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
