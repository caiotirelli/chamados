<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Categorias')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('categorias')}"></nav>
<main class="container">
    <div th:replace="~{fragments/layout :: mensagens}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Categorias</h1>
        <a class="btn btn-primary" th:href="@{/app/categorias/novo}">+ Nova categoria</a>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr><th>#</th><th>Nome</th><th>Descrição</th><th class="text-end">Ações</th></tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(categorias)}">
                    <td colspan="4" class="text-center text-muted py-4">Nenhuma categoria cadastrada.</td>
                </tr>
                <tr th:each="c : ${categorias}">
                    <td th:text="${c.id}">1</td>
                    <td th:text="${c.nome}">Nome</td>
                    <td th:text="${c.descricao} ?: '-'">Descrição</td>
                    <td class="text-end acoes">
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/app/categorias/{id}/editar(id=${c.id})}">Editar</a>
                        <form th:action="@{/app/categorias/{id}(id=${c.id})}" th:method="delete"
                              onsubmit="return confirm('Excluir esta categoria?')">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Excluir</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
