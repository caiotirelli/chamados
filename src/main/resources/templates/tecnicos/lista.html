<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Técnicos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('tecnicos')}"></nav>
<main class="container">
    <div th:replace="~{fragments/layout :: mensagens}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Técnicos</h1>
        <a class="btn btn-primary" th:href="@{/app/tecnicos/novo}">+ Novo técnico</a>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr><th>#</th><th>Nome</th><th>E-mail</th><th>Perfil</th><th class="text-end">Ações</th></tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(tecnicos)}">
                    <td colspan="5" class="text-center text-muted py-4">Nenhum técnico cadastrado.</td>
                </tr>
                <tr th:each="t : ${tecnicos}">
                    <td th:text="${t.id}">1</td>
                    <td th:text="${t.nome}">Nome</td>
                    <td th:text="${t.email}">email</td>
                    <td><span class="badge text-bg-secondary" th:text="${t.perfil}">TECNICO</span></td>
                    <td class="text-end acoes">
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/app/tecnicos/{id}/editar(id=${t.id})}">Editar</a>
                        <form th:action="@{/app/tecnicos/{id}(id=${t.id})}" th:method="delete"
                              onsubmit="return confirm('Excluir este técnico?')">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Excluir</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
