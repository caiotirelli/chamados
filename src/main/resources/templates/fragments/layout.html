<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<!-- Fragments reutilizados por todas as páginas (th:replace="~{fragments/layout :: nome}") -->

<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | Sistema de Chamados'">Sistema de Chamados</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<nav th:fragment="navbar(ativo)" class="navbar navbar-expand-md navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/app/chamados}">Sistema de Chamados</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
                aria-controls="menu" aria-expanded="false" aria-label="Abrir menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:classappend="${ativo == 'chamados'} ? 'active'" th:href="@{/app/chamados}">Chamados</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${ativo == 'clientes'} ? 'active'" th:href="@{/app/clientes}">Clientes</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${ativo == 'categorias'} ? 'active'" th:href="@{/app/categorias}">Categorias</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${ativo == 'tecnicos'} ? 'active'" th:href="@{/app/tecnicos}">Técnicos</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/swagger-ui.html}" target="_blank">API</a></li>
            </ul>
        </div>
    </div>
</nav>

<div th:fragment="mensagens">
    <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${sucesso}">Sucesso</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
    </div>
    <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${erro}">Erro</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
    </div>
</div>

<!-- Erros de regra de negócio (ex.: e-mail duplicado) registrados com bindingResult.reject(...). Usar dentro de um form com th:object. -->
<div th:fragment="errosGlobais" th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
    <div th:each="e : ${#fields.globalErrors()}" th:text="${e}">Erro</div>
</div>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
